name: Build the tool
description: >
  Build xfina-data from the checked-out commit. The commit is the tool's version:
  every data commit a run makes names the code commit that produced it.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Build
      shell: bash
      run: cargo build --release --locked --bin xfina-data
