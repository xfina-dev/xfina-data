[package]
name = "xfina-data"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The deliverable is the published data, not a crate. Binaries are attached to
# GitHub Releases and the daily job downloads one; nothing here is consumed as
# a library, so there is nothing to publish to a registry.
publish = false

[workspace]
resolver = "2"
members = [
    "xtask"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xfina-dev/xfina-data"
homepage = "https://data.xfina.dev"
description = "Public data backbone for Indian personal finance — fetches, archives and publishes open datasets"
readme = "README.md"
keywords = ["finance", "india", "data", "datasets", "csv"]
categories = ["finance", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
# R2 speaks the S3 API. The archive's immutability rests on a conditional
# write (`If-None-Match: *`), so the client has to support one.
aws-sdk-s3 = { version = "1.152", features = ["behavior-version-latest"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
reqwest = { version = "0.13", features = ["gzip"] }
rust_decimal = { version = "1.42", features = ["serde", "serde-with-str"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is deprecated and unmaintained; serde_yaml_ng is the most widely
# adopted continuation of it.
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
# A published dependency, never a path one: what this tool is built against is
# what anyone else can build against. Only the rate-sheet parser is compiled in.
xfina = { version = "0.8", default-features = false, features = ["rt-sbi-forex-card"] }

[dependencies]
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
xfina = { workspace = true }
