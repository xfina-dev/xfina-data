name: Report a problem
description: A dataset looks wrong, is missing a day, or a page on data.xfina.dev didn't work.
title: "[Problem] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Issues here are public: please leave out your own files, account details and amounts.
  - type: input
    id: tool
    attributes:
      label: Dataset or page
      placeholder: sbi-forex-card-usd
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. For a wrong value, the date and the figure the source shows help most.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The steps, file or URL that lead to it, if you know them. A screenshot helps.
  - type: textarea
    id: environment
    attributes:
      label: Page and browser
      description: Filled in for you when you come from data.xfina.dev.
      render: text
