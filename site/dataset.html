<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Xfina Data</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/theme.js"></script>
</head>
<body>
<main class="stack">
<!-- HEADER -->

  <section class="card">
    <div class="card-header">
      <p class="crumb"><a href="/">All datasets</a> / <code>{{ID}}</code></p>
      <div class="title-row">
        <h1 class="card-title">{{TITLE}}</h1>
        <div class="title-actions">
          <a class="csv-url" href="/{{CSV_PATH}}"><code>https://data.xfina.dev/{{CSV_PATH}}</code></a>
          <button type="button" class="btn btn-outline btn-sm" id="copy-url"
            data-url="https://data.xfina.dev/{{CSV_PATH}}">Copy URL</button>
          <a class="btn btn-sm" href="/{{CSV_PATH}}" download>Download CSV</a>
        </div>
      </div>
      <p class="card-description">{{SUMMARY}}</p>
      <div class="facts" style="margin-top: 12px">{{FACTS}}</div>
    </div>

    <div class="control-bar" aria-label="Controls">
      <div class="control">
        <span class="control-label">View</span>
        <div class="segmented" role="group" aria-label="View" id="views"></div>
      </div>
      <div class="control">
        <span class="control-label">Values</span>
        <div class="segmented" role="group" aria-label="Values" id="modes"></div>
      </div>
      <div class="control">
        <span class="control-label">Period</span>
        <div class="segmented" role="group" aria-label="Period" id="ranges"></div>
      </div>
      <div class="control">
        <span class="control-label">From – to</span>
        <div class="date-range">
          <input type="date" class="input" id="from" aria-label="Period starts">
          <span aria-hidden="true">→</span>
          <input type="date" class="input" id="to" aria-label="Period ends">
        </div>
      </div>
      <p class="period" id="period"></p>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>

    <div class="card-content">
      <div id="chart-panel">
        <div id="chart" role="img" aria-label="{{TITLE}}, chart"></div>
      </div>
      <div id="calendar-panel" hidden>
        <div class="calendar-wrap"><div id="calendar" role="img" aria-label="{{TITLE}}, calendar"></div></div>
      </div>
      <div id="navigator" aria-label="Period: drag to choose"></div>
      <p class="note" id="note"></p>
      <p class="note" id="status" role="status">Loading…</p>
    </div>
  </section>

  <section class="card">
    <div class="card-content">
      <dl class="about">
        <dt>Columns</dt><dd><code>{{COLUMNS}}</code></dd>
        <dt>Source</dt><dd>{{SOURCE}}</dd>
        <dt>Licence</dt><dd>{{LICENCE}}</dd>
        <dt>Raw documents</dt><dd><a href="/{{MANIFEST_PATH}}">{{RAW_FILES}} archived files</a>, each with its sha256, fetch time and source URL</dd>
      </dl>
    </div>
  </section>
</main>
<script id="config" type="application/json">{{CONFIG_JSON}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js"
  integrity="sha512-Uyq/AgtqFM4vT+unIGTDr4wMJDTUK9O5w2PXMQeBCSR8koqHpVz+qBmcQ+9Oeo5H+EmvT4pp/5QrsqhIbyjHTQ=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/assets/preview.js"></script>
</body>
</html>
